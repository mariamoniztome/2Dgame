name: Build Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --mac dir

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/mac-arm64/Bruxa Bruxinha.app"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Bruxa Bruxinha" \
            -srcfolder "dist/mac-arm64/Bruxa Bruxinha.app" \
            -ov -format UDZO \
            "dist/BruxaBruxinha.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Bruxa-Bruxinha-Mac
          path: dist/BruxaBruxinha.dmg
