name: Build Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Build Electron DMG
        run: npx electron-builder

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Bruxa-Bruxinha-Mac
          path: dist/*.dmg
