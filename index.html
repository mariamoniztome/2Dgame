<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruxa, Bruxinha</title>
  <link rel="icon" href="/assets/zone1/bruxinha.svg" type="image/svg+xml">
  <!-- Red Hat Text — UI body font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <!-- P22 Ringwell — display font (Adobe Fonts). Add your kit script here:
       <script src="https://use.typekit.net/YOUR_KIT_ID.js"></script>
       <script>try{Typekit.load({async:true});}catch(e){}</script>
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec87e; }
    canvas { display: block; }

    /* ── Loading overlay — visible immediately, before Phaser starts ── */
    #game-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f6a3b3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.55s ease;
    }
    #game-loading.fade-out { opacity: 0; pointer-events: none; }

    #loading-corner-left,
    #loading-corner-right {
      position: absolute;
      top: 0;
      height: 100%;
      width: auto;
      pointer-events: none;
      user-select: none;
    }
    #loading-corner-left  { left: 0; }
    #loading-corner-right { right: 0; }

    #loading-title {
      position: relative;
      z-index: 1;
      width: min(66vw, 860px);
      height: auto;
      display: block;
      margin-bottom: 2.25rem;
    }

    #loading-bar-track {
      position: relative;
      z-index: 1;
      width: min(34vw, 440px);
      height: 10px;
      background: rgba(180, 45, 39, 0.22);
      border-radius: 5px;
      overflow: hidden;
    }
    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 5px;
      transition: width 0.12s ease;
    }
    #loading-text {
      position: relative;
      z-index: 1;
      font-family: 'Red Hat Text', sans-serif;
      font-size: clamp(12px, 1.2vw, 15px);
      color: #000000;
      margin-top: 0.65rem;
      letter-spacing: 0.02em;
    }

    /* ── Controls / help panel (H key) ────────────────────────────────── */
    #controls-panel {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    #controls-panel.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .ctrl-card {
      position: relative;
      background: #f6a3b3;
      border-radius: 18px;
      width: min(62vw, 820px);
      overflow: hidden;
    }
    .ctrl-card .ctrl-corner {
      position: absolute;
      top: 0;
      height: 100%;
      width: auto;
      pointer-events: none;
      user-select: none;
    }
    .ctrl-card .ctrl-corner-left  { left: 0; }
    .ctrl-card .ctrl-corner-right { right: 0; }
    .ctrl-content {
      position: relative;
      z-index: 1;
      padding: 2.4rem 5.5rem 2rem;
    }
    .ctrl-title {
      font-family: 'Red Hat Text', sans-serif;
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 700;
      color: #000000;
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .ctrl-rows {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 3rem;
      row-gap: 0.55rem;
    }
    .ctrl-key {
      font-family: 'Red Hat Text', sans-serif;
      font-size: clamp(13px, 1.4vw, 19px);
      font-weight: 700;
      color: #000000;
      white-space: nowrap;
    }
    .ctrl-action {
      font-family: 'Red Hat Text', sans-serif;
      font-size: clamp(13px, 1.4vw, 19px);
      font-weight: 400;
      color: #000000;
    }
    .ctrl-hint {
      font-family: 'Red Hat Text', sans-serif;
      font-size: clamp(10px, 1vw, 13px);
      color: #444444;
      text-align: center;
      margin-top: 1.6rem;
    }
    .ctrl-hint kbd {
      font-family: 'Red Hat Text', sans-serif;
      font-style: normal;
      font-weight: 700;
      font-size: inherit;
      background: rgba(0,0,0,0.12);
      border-radius: 5px;
      padding: 1px 7px;
    }
  </style>
</head>
<body>

  <!-- Loading screen — visible immediately, removed by BootScene when assets are ready -->
  <div id="game-loading">
    <img id="loading-corner-left"  src="/assets/loading/loading_left.svg"  alt="">
    <img id="loading-corner-right" src="/assets/loading/loading_right.svg" alt="">
    <img id="loading-title"        src="/assets/loading/loading_title.svg" alt="Bruxa, Bruxinha">
    <div id="loading-bar-track">
      <div id="loading-bar-fill"></div>
    </div>
    <p id="loading-text">A carregar…</p>
  </div>

  <!-- Controls / help panel — toggled by H / ESC, driven by HUD scene -->
  <div id="controls-panel">
    <div class="ctrl-card">
      <img class="ctrl-corner ctrl-corner-left"  src="/assets/loading/loading_left.svg"  alt="">
      <img class="ctrl-corner ctrl-corner-right" src="/assets/loading/loading_right.svg" alt="">
      <div class="ctrl-content">
        <h2 class="ctrl-title">Controlos</h2>
        <div class="ctrl-rows">
          <span class="ctrl-key">WASD / Setas</span><span class="ctrl-action">Mover</span>
          <span class="ctrl-key">Shift</span>        <span class="ctrl-action">Correr</span>
          <span class="ctrl-key">C</span>            <span class="ctrl-action">Apanhar / Interagir</span>
          <span class="ctrl-key">F</span>            <span class="ctrl-action">Lançar feitiço activo</span>
          <span class="ctrl-key">Q</span>            <span class="ctrl-action">Mudar feitiço</span>
          <span class="ctrl-key">I</span>            <span class="ctrl-action">Inventário de plantas</span>
          <!-- <span class="ctrl-key">B</span>            <span class="ctrl-action">Livro de feitiços</span> -->
          <span class="ctrl-key">M</span>            <span class="ctrl-action">Mapa do jardim</span>
          <span class="ctrl-key">Espaço</span>      <span class="ctrl-action">Pausar</span>
          <span class="ctrl-key">H</span>            <span class="ctrl-action">Ajuda</span>
        </div>
        <p class="ctrl-hint"><kbd>H</kbd> · <kbd>ESC</kbd> · clica fora para fechar</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
